name: probe-dfc
# Temporário (fase 3): imprime as contas do DFC das empresas da lista para escolher o FCFE.
on:
  push:
    branches: [claude/vibrant-bardeen-oy408v]
    paths: [scripts/probe_dfc.py, .github/workflows/probe-dfc.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/probe_dfc.py 2024 2021
