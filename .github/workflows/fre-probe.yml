name: fre-probe
# TEMPORÁRIO (remover quando o parser do FRE estiver escrito). Sonda de formato, sem banco.
on:
  push:
    branches: ["claude/fase-2-indicadores-filtro-qy5py2"]
    paths:
      - "scripts/probe_fre.py"
      - ".github/workflows/fre-probe.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/probe_fre.py
