name: probe-tariffs
# Temporário (fase 4): imprime as tarifas da B3 para ações à vista, para conferir a tabela de custos.
on:
  push:
    branches: [claude/charming-thompson-heh40k]
    paths: [scripts/probe_tariffs.py, .github/workflows/probe-tariffs.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/probe_tariffs.py
