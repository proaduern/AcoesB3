name: probe-rad
# Temporário: verifica o formato real da consulta externa do RAD/ENET da CVM.
on:
  push:
    branches: [ccr-c01e6dec-u8z1ix]
    paths: [".github/workflows/probe-rad.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - shell: python
        run: |
          import re, requests
          s = requests.Session(); s.headers.update({"User-Agent": "Mozilla/5.0 AcoesB3-probe"})
          r = s.get("https://www.rad.cvm.gov.br/ENETWeb/frmConsultaExternaCVM.aspx", timeout=60)
          print("=====HTML", r.status_code, r.url, len(r.text))
          html = r.text
          # remove blocos grandes de estilo e viewstate
          html = re.sub(r"<style.*?</style>", "<style/>", html, flags=re.S)
          html = re.sub(r'value="[A-Za-z0-9+/=]{200,}"', 'value="..."', html)
          print(html[:30000])
          print("=====END")
          for src in re.findall(r'src="([^"]+)"', r.text):
              if "ruxit" in src or not (".js" in src or "ScriptResource" in src or "WebResource" in src):
                  continue
              url = requests.compat.urljoin(r.url, src)
              js = s.get(url, timeout=60)
              t = js.text
              print("=====JS", url[:150], js.status_code, len(t))
              hits = list(re.finditer(r"\.aspx/\w+|ListarDocumentos|ajax\(|url\s*:", t))
              for m in hits[:15]:
                  print("   ", t[max(0, m.start()-400):m.start()+800].replace("\n", " "))
