name: probe-rad
# Temporário: verifica o formato real da consulta externa do RAD/ENET da CVM.
on:
  push:
    branches: [ccr-c01e6dec-u8z1ix]
    paths: [".github/workflows/probe-rad.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - shell: python
        run: |
          import re, requests
          s = requests.Session(); s.headers.update({"User-Agent": "Mozilla/5.0 AcoesB3-probe"})
          base = "https://www.rad.cvm.gov.br/ENET/"
          r = s.get(base + "frmConsultaExternaCVM.aspx", timeout=60)
          print("=====HTML", r.status_code, r.url)
          print(r.text)
          print("=====END")
          for src in re.findall(r'(?:src|href)="([^"]+\.js[^"]*)"', r.text):
              if "ruxit" in src:
                  continue
              url = src if src.startswith("http") else requests.compat.urljoin(r.url, src)
              js = s.get(url, timeout=60)
              print("=====JS", url, js.status_code, len(js.text))
              t = js.text
              for m in re.finditer(r"ajax|url\s*:|\.aspx/|ListarDocumentos|POST", t):
                  print("   ", t[max(0, m.start()-300):m.start()+600].replace("\n", " "))
