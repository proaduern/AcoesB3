name: probe-rad
# Temporário: verifica o formato real da consulta externa do RAD/ENET da CVM.
on:
  push:
    branches: [ccr-c01e6dec-u8z1ix]
    paths: [".github/workflows/probe-rad.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - shell: python
        run: |
          import re, requests
          UA = {"User-Agent": "Mozilla/5.0 AcoesB3-probe"}
          s = requests.Session(); s.headers.update(UA)
          for ds in ("cia_aberta-doc-ipe",):
              r = s.get(f"https://dados.cvm.gov.br/dataset/{ds}", timeout=60)
              t = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", r.text))
              for kw in ("Periodicidade", "atualizad"):
                  for m in re.finditer(kw, t):
                      print(f"[{ds}]", t[max(0, m.start()-120):m.start()+220])
          base = "https://www.rad.cvm.gov.br/ENET/"
          r = s.get(base + "frmConsultaExternaCVM.aspx", timeout=60)
          print("GET consulta", r.status_code, len(r.text), r.headers.get("Content-Type"))
          html = r.text
          for m in re.finditer(r"ListarDocumentos|PageMethods|\.aspx/\w+", html):
              print("  html:", html[max(0, m.start()-200):m.start()+300].replace("\n", " "))
          scripts = re.findall(r'<script[^>]+src="([^"]+)"', html)
          print("scripts:", scripts)
          for src in scripts:
              url = src if src.startswith("http") else base + src.lstrip("/")
              try:
                  js = s.get(url, timeout=60).text
              except Exception as e:
                  print("fail", url, e); continue
              for m in re.finditer(r"ListarDocumentos", js):
                  print(f"  [{src}]", js[max(0, m.start()-1500):m.start()+1500].replace("\n", " "))
          # inline scripts
          for m in re.finditer(r"<script[^>]*>(.*?)</script>", html, re.S):
              body = m.group(1)
              if "ListarDocumentos" in body or "dataDe" in body or "categoria" in body.lower():
                  print("  inline:", body[:4000].replace("\n", " "))
