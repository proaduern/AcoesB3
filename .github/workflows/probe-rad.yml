name: probe-rad
# Temporário: verifica o formato real da consulta externa do RAD/ENET da CVM.
on:
  push:
    branches: [ccr-c01e6dec-u8z1ix]
    paths: [".github/workflows/probe-rad.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - shell: python
        run: |
          import re, requests
          s = requests.Session(); s.headers.update({"User-Agent": "Mozilla/5.0 AcoesB3-probe"})
          t = s.get("https://www.rad.cvm.gov.br/ENETWeb/js/forms/frmConsultaExternaCVM.js", timeout=60).text
          names = sorted(set(re.findall(r"aspx/(\w+)", t)))
          print("ENDPOINTS:", names)
          for n in names:
              for m in re.finditer(re.escape("aspx/" + n), t):
                  start = t.rfind("$.ajax", 0, m.start())
                  fstart = t.rfind("function", 0, start)
                  print(f"===== {n} @ {m.start()}")
                  print(t[max(0, fstart - 50):m.start() + 2500])
                  break
          for kw in ("Pesquisar", "dataTable(", "DataTable(", "dataDe", "dataAte", "categoria"):
              m = t.find(kw)
              print(f"----- {kw} @ {m}")
