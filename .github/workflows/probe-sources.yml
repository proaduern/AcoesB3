name: probe-sources
# Temporário: carga histórica completa num Postgres descartável para medir tamanho e
# exercitar os parsers em todos os anos (rodada 3). Será removido ao fim da fase 1.
on:
  push:
    branches: [ccr-c01e6dec-u8z1ix]
    paths: [".github/workflows/probe-sources.yml"]
  workflow_dispatch:
jobs:
  full-load:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: acoes
          POSTGRES_PASSWORD: acoes
          POSTGRES_DB: acoes
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U acoes" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: pipeline
    env:
      NEON_DATABASE_URL: postgresql://acoes:acoes@localhost:5432/acoes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: acoesb3 cad
      - run: acoesb3 cvm --doc FCA
      - run: acoesb3 cvm --doc DFP
        if: always()
      - run: acoesb3 cvm --doc ITR --from-year 2011
        if: always()
      - run: acoesb3 cotahist
        if: always()
      - run: acoesb3 size
        if: always()
      - name: Resumo
        if: always()
        run: |
          psql "$NEON_DATABASE_URL" -c "select job, status, finished_at - started_at as dur, detail from collection_run order by id"
          psql "$NEON_DATABASE_URL" -c "select doc_type, extract(year from reference_date) y, count(*), count(*) filter (where has_lines) com_contas from filing group by 1,2 order by 1,2"
          psql "$NEON_DATABASE_URL" -c "select extract(year from trade_date) y, count(*), count(distinct security_id) from quote_daily group by 1 order by 1"
          psql "$NEON_DATABASE_URL" -c "select source_scale, count(*) from financial_line group by 1"
          psql "$NEON_DATABASE_URL" -c "select s.ticker, q.trade_date, q.close from quote_daily q join security s on s.id=q.security_id where s.ticker in ('PETR4','TAEE11','WEGE3') and q.trade_date in ('2024-01-02','2026-09-30') order by 1,2"
          psql "$NEON_DATABASE_URL" -c "select percentile_disc(array[0.5,0.9,0.99]) within group (order by f.received_date - f.reference_date) from filing f where doc_type='ITR' and version=1"
