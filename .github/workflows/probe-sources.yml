name: probe-sources
on:
  push:
    branches: [ccr-c01e6dec-u8z1ix]
    paths: [scripts/probe_fixtures.py, .github/workflows/probe-sources.yml]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Segredos disponíveis? (só o tamanho, nunca o valor)
        env:
          A: ${{ secrets.NEON_DATABASE_URL }}
          B: ${{ secrets.NEON_DATABASE_URL_POOLED }}
        run: echo "NEON_DATABASE_URL len=${#A}  NEON_DATABASE_URL_POOLED len=${#B}"
      - run: python scripts/probe_fixtures.py
