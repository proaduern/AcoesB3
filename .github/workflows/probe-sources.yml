name: probe-sources
on:
  push:
    branches: [ccr-c01e6dec-u8z1ix]
    paths: [scripts/probe_sources.py, .github/workflows/probe-sources.yml]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/probe_sources.py
