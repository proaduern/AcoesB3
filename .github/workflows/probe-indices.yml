name: probe-indices
# Temporário (fase 4): imprime o formato real do CDI (BCB) e dos índices (B3) para escolher o parser.
on:
  push:
    branches: [claude/charming-thompson-heh40k]
    paths: [scripts/probe_indices.py, .github/workflows/probe-indices.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/probe_indices.py
