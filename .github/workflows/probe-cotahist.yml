name: probe-cotahist
# Temporário: investiga linhas duplicadas nas demonstrações da CVM a partir de 2021.
on:
  push:
    branches: [ccr-c01e6dec-u8z1ix]
    paths: [".github/workflows/probe-cotahist.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - shell: python
        run: |
          import io, zipfile, requests
          from collections import defaultdict, Counter
          for doc, y in (("DFP", 2024), ("DFP", 2020), ("ITR", 2025)):
              t = doc.lower()
              r = requests.get(f"https://dados.cvm.gov.br/dados/CIA_ABERTA/DOC/{doc}/DADOS/{t}_cia_aberta_{y}.zip", timeout=300)
              z = zipfile.ZipFile(io.BytesIO(r.content))
              for st in ("BPA_con", "DRE_con"):
                  lines = z.read(f"{t}_cia_aberta_{st}_{y}.csv").decode("latin-1").splitlines()
                  cols = lines[0].split(";")
                  g = defaultdict(list)
                  for ln in lines[1:]:
                      d = dict(zip(cols, ln.split(";")))
                      if d["ORDEM_EXERC"] != "ÚLTIMO":
                          continue
                      g[(d["CD_CVM"], d["DT_REFER"], d["VERSAO"], d["CD_CONTA"], d.get("DT_INI_EXERC"), d["DT_FIM_EXERC"])].append(ln)
                  dups = {k: v for k, v in g.items() if len(v) > 1}
                  print(f"== {doc} {y} {st}: chaves {len(g)}, duplicadas {len(dups)}, empresas {len({k[0] for k in dups})}")
                  print("   iguais byte a byte:", sum(1 for v in dups.values() if len(set(v)) == 1))
                  diff_cols = Counter()
                  for v in dups.values():
                      rows = [dict(zip(cols, x.split(";"))) for x in v]
                      for c in cols:
                          if len({r[c] for r in rows}) > 1:
                              diff_cols[c] += 1
                  print("   colunas que diferem:", diff_cols.most_common())
                  for k, v in list(dups.items())[:3]:
                      for x in v:
                          print("   |", x[:400])
