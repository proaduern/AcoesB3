name: compute
# Fase 2: fatos anuais, outliers, eventos societários e retratos do filtro.
# Primeira execução depois da migração 0004: marque reload_dfp para regravar as contas de
# DVA de bancos e seguradoras (as contas novas só valem para documentos recarregados).
on:
  workflow_dispatch:
    inputs:
      reload_dfp:
        description: "Recarregar todas as DFP antes de calcular (~10 min)"
        type: boolean
        default: false
      load_fre:
        description: "Carregar o FRE (ações, desdobramentos e proventos) antes de calcular (~3 min)"
        type: boolean
        default: false
      skip_compute:
        description: "Não calcular: só imprimir as pendências de revisão (rápido)"
        type: boolean
        default: false
      priority_only:
        description: "Pendências: só os outliers que mudam um resultado (review list --priority)"
        type: boolean
        default: false
      watch_find:
        description: "Procurar empresas pelo nome (separe vários por ponto e vírgula)"
        required: false
      watch_add:
        description: "Adicionar à lista acompanhada: codigo:carteira|radar:segmento, separados por ponto e vírgula"
        required: false
      watch_explain:
        description: "Explicar empresas: códigos CVM separados por ponto e vírgula"
        required: false
      sql:
        description: "Diagnóstico: consultas SQL somente leitura, separadas por ###"
        required: false
      watch_candidates:
        description: "Listar candidatas ao radar por segmento"
        type: boolean
        default: false
      step:
        description: "Etapa (vazio = todas): annual, outliers, events ou screens"
        required: false
concurrency:
  group: neon-writer
  cancel-in-progress: false
jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: pipeline
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      RELOAD_DFP: ${{ inputs.reload_dfp }}
      STEP: ${{ inputs.step }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Verifica segredo
        run: test -n "$NEON_DATABASE_URL" || { echo "::error::segredo NEON_DATABASE_URL vazio"; exit 1; }
      - name: Recarrega DFP
        if: ${{ inputs.reload_dfp }}
        run: acoesb3 cvm --doc DFP --force
      - name: Carrega FRE
        if: ${{ inputs.load_fre }}
        run: acoesb3 cvm --doc FRE
      - name: Calcula
        if: ${{ !inputs.skip_compute }}
        run: |
          args=()
          [ -n "$STEP" ] && args+=(--step "$STEP")
          acoesb3 compute "${args[@]}"
      - name: Pendências de revisão
        env:
          PRIORITY_ONLY: ${{ inputs.priority_only }}
        run: |
          if [ "$PRIORITY_ONLY" = "true" ]; then
            acoesb3 review list --priority --limit 300
          else
            acoesb3 review list
          fi
      - name: Lista de acompanhamento
        if: ${{ inputs.watch_find != '' || inputs.watch_candidates || inputs.watch_add != '' || inputs.watch_explain != '' }}
        env:
          WATCH_ADD: ${{ inputs.watch_add }}
          WATCH_EXPLAIN: ${{ inputs.watch_explain }}
          WATCH_FIND: ${{ inputs.watch_find }}
          WATCH_CANDIDATES: ${{ inputs.watch_candidates }}
        run: |
          if [ -n "$WATCH_ADD" ]; then
            IFS=';' read -ra items <<< "$WATCH_ADD"
            for it in "${items[@]}"; do
              IFS=':' read -r cvm role seg <<< "$it"
              acoesb3 watch add --cvm "$cvm" --role "$role" --segment "$seg"
            done
            acoesb3 watch list
          fi
          if [ -n "$WATCH_EXPLAIN" ]; then
            args=()
            IFS=';' read -ra codes <<< "$WATCH_EXPLAIN"
            for c in "${codes[@]}"; do args+=(--cvm "$c"); done
            acoesb3 watch explain "${args[@]}"
          fi
          if [ -n "$WATCH_FIND" ]; then
            args=()
            IFS=';' read -ra names <<< "$WATCH_FIND"
            for n in "${names[@]}"; do args+=(--name "$n"); done
            acoesb3 watch find "${args[@]}"
          fi
          if [ "$WATCH_CANDIDATES" = "true" ]; then
            acoesb3 watch candidates --per-segment 6
          fi
      - name: Consultas de diagnóstico
        if: ${{ inputs.sql != '' }}
        env:
          SQL: ${{ inputs.sql }}
        run: |
          args=()
          while IFS= read -r -d '' q; do [ -n "${q// /}" ] && args+=(--query "$q"); done < <(printf '%s' "$SQL" | sed 's/###/\x00/g'; printf '\0')
          acoesb3 sql "${args[@]}"
      - run: acoesb3 size
