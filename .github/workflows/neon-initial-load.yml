name: neon-initial-load
# Temporário: primeira carga completa no Neon a partir da branch de desenvolvimento
# (workflow_dispatch só funciona na branch padrão). Remover após a carga.
on:
  push:
    branches: [ccr-c01e6dec-u8z1ix]
    paths: [".github/workflows/neon-initial-load.yml"]
concurrency:
  group: neon-writer
  cancel-in-progress: false
jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: pipeline
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Verifica segredo (só tamanho e host, nunca a senha)
        run: |
          test -n "$NEON_DATABASE_URL" || { echo "::error::segredo NEON_DATABASE_URL vazio"; exit 1; }
          echo "tamanho=${#NEON_DATABASE_URL}"
          case "$NEON_DATABASE_URL" in *-pooler*) echo "::warning::URL tem -pooler; o pipeline deve usar a conexão direta";; *) echo "conexão direta (sem -pooler)";; esac
      - run: acoesb3 migrate
      - run: acoesb3 cad
      - run: acoesb3 cvm --doc FCA
        if: always()
      - run: acoesb3 cvm --doc DFP
        if: always()
      - run: acoesb3 cvm --doc ITR --from-year 2011
        if: always()
      - run: acoesb3 cotahist
        if: always()
      - run: acoesb3 size
        if: always()
      - name: Resumo
        if: always()
        run: |
          psql "$NEON_DATABASE_URL" -c "select job, status, finished_at - started_at as dur from collection_run where status <> 'ok' order by id"
          psql "$NEON_DATABASE_URL" -c "select status, count(*) from collection_run group by 1"
          psql "$NEON_DATABASE_URL" -c "select doc_type, count(*), count(*) filter (where has_lines) com_contas from filing group by 1 order by 1"
          psql "$NEON_DATABASE_URL" -c "select s.ticker, q.trade_date, q.close from quote_daily q join security s on s.id=q.security_id where s.ticker in ('PETR4','TAEE11','WEGE3') and q.trade_date = '2026-09-30' order by 1"
          psql "$NEON_DATABASE_URL" -c "select f.cvm_code, l.account_code, l.value from financial_line l join filing f on f.id=l.filing_id where f.doc_type='DFP' and f.reference_date='2024-12-31' and ((f.cvm_code=5410 and l.account_code in ('3.11.01','3.99.01.01')) or (f.cvm_code=19348 and l.account_code='3.09.01') or (f.cvm_code=23159 and l.account_code='3.13.01')) order by 1,2"
