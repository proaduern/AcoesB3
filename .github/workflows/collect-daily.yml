name: collect-daily
# Cotação diária da B3 (COTAHIST_D) sai por volta de 21h45 (Brasília) do próprio pregão.
# Roda às 23h50 de Brasília (02:50 UTC) de terça a sábado, cobrindo o pregão de seg a sex.
# DFP/ITR/FCA da CVM são atualizados semanalmente; a coleta diária só reprocessa o que mudou.
on:
  schedule:
    - cron: "50 2 * * 2-6"
  workflow_dispatch:
concurrency:
  group: neon-writer
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pipeline
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Verifica segredo
        run: test -n "$NEON_DATABASE_URL" || { echo "::error::segredo NEON_DATABASE_URL vazio"; exit 1; }
      - run: acoesb3 daily
