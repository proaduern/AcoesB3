name: backtest-branch
# Temporário (fase 4): roda freeze/validate pela branch enquanto backtest.yml não está na branch padrão.
# Pedido em .github/backtest-request.txt (uma etapa por linha). Remover depois do merge.
on:
  push:
    branches: [claude/charming-thompson-heh40k]
    paths: [.github/backtest-request.txt]
concurrency:
  group: neon-writer
  cancel-in-progress: false
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: pipeline
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: Etapas pedidas
        run: |
          test -n "$NEON_DATABASE_URL" || { echo "::error::segredo NEON_DATABASE_URL vazio"; exit 1; }
          while IFS= read -r line; do
            case "$line" in
              freeze:dy_5) acoesb3 backtest freeze --scenario dy_5 --note "escolhido pelo usuário em 08/10/2026 com os dados de ajuste" ;;
              validate) acoesb3 backtest validate ;;
              report) acoesb3 backtest report --warnings ;;
              ""|\#*) ;;
              *) echo "::error::etapa não permitida: $line"; exit 1 ;;
            esac
          done < ../.github/backtest-request.txt
      - run: acoesb3 size
